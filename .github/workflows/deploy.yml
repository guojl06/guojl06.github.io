name: Deploy site

on:
  repository_dispatch:
    types: [sync-notes]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site source 🛎️
        uses: actions/checkout@v4
        with:
          repository: smartThise/ciallo-src
          ref: master
          token: ${{ secrets.REPO_TOKEN }}

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Setup Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install JS deps 📦
        run: npm ci
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: "smartThise/ciallo-src"
      - name: Install typst + CJK fonts ✒️
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          curl -fsSL https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz \
            | tar xJ --strip-components=1 -C /usr/local/bin
      - name: Checkout sTBook 📚
        run: git clone --depth 1 https://github.com/smartThise/sTBook.git _notes_src
      - name: Sync notes wiki 🔄
        run: python3 scripts/sync_notes.py --no-pull
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          export LANG=C.UTF-8 LC_ALL=C.UTF-8
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Upload Pages artifact 📦
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
