name: Deploy site

on:
  repository_dispatch:
    types: [sync-notes]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TYPST_VERSION: "0.14.2"
      APT_PACKAGES: "fonts-noto-cjk imagemagick"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site source 🛎️
        uses: actions/checkout@v4
        with:
          repository: smartThise/ciallo-src
          ref: master
          token: ${{ secrets.REPO_TOKEN }}

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.13"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Setup Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install JS deps 📦
        run: npm ci
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: "smartThise/ciallo-src"
      - name: Prepare tool cache keys
        id: tool-cache
        run: |
          . /etc/os-release
          echo "distro=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "packages=$(printf '%s' "$APT_PACKAGES" | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
          case "$(uname -m)" in
            x86_64|aarch64) echo "typst-target=$(uname -m)-unknown-linux-musl" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported Typst architecture" >&2; exit 1 ;;
          esac
      - name: Cache apt downloads
        uses: actions/cache@v4
        with:
          # Cache package archives only, never /usr, dpkg state, or apt locks.
          path: ${{ runner.temp }}/soeasysite-apt/*.deb
          key: apt-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.tool-cache.outputs.distro }}-${{ steps.tool-cache.outputs.packages }}-${{ steps.tool-cache.outputs.week }}
          restore-keys: |
            apt-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.tool-cache.outputs.distro }}-${{ steps.tool-cache.outputs.packages }}-
      - name: Install CJK fonts and ImageMagick
        timeout-minutes: 8
        run: |
          mkdir -p "$RUNNER_TEMP/soeasysite-apt"
          read -r -a packages <<< "$APT_PACKAGES"
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" -o "Dir::Cache::archives=$RUNNER_TEMP/soeasysite-apt" \
            -o APT::Keep-Downloaded-Packages=true install -y "${packages[@]}"
      - name: Cache Typst binary
        id: typst-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/typst
          key: typst-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.TYPST_VERSION }}-${{ steps.tool-cache.outputs.typst-target }}
      - name: Download Typst on cache miss
        if: steps.typst-cache.outputs.cache-hit != 'true'
        env:
          TYPST_TARGET: ${{ steps.tool-cache.outputs.typst-target }}
        run: |
          curl -fsSL --retry 3 "https://github.com/typst/typst/releases/download/v$TYPST_VERSION/typst-$TYPST_TARGET.tar.xz" \
            -o "$RUNNER_TEMP/typst.tar.xz"
          tar xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP" "typst-$TYPST_TARGET/typst"
          install -Dm755 "$RUNNER_TEMP/typst-$TYPST_TARGET/typst" "$HOME/.local/bin/typst"
      - name: Enable Typst ✒️
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/typst" --version
      - name: Checkout sTBook 📚
        run: git clone --depth 1 https://github.com/smartThise/sTBook.git _notes_src
      - name: Sync notes wiki 🔄
        run: |
          pip3 install pyyaml
          python3 scripts/sync_notes.py --no-pull
      - name: Install and Build 🔧
        run: |
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          export LANG=C.UTF-8 LC_ALL=C.UTF-8
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Write release marker
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          def head(directory):
              return subprocess.check_output(
                  ["git", "-C", directory, "rev-parse", "HEAD"], text=True
              ).strip()

          release = {
              "source_sha": head("."),
              "notes_sha": head("_notes_src"),
              "workflow_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          Path("_site/soeasysite-release.json").write_text(
              json.dumps(release, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(release))
          PY
      - name: Upload Pages artifact 📦
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public release
        timeout-minutes: 6
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          expected = json.loads(Path("_site/soeasysite-release.json").read_text())
          base_url = os.environ["PAGES_URL"].rstrip("/") + "/"
          if urllib.parse.urlsplit(base_url).scheme != "https":
              raise SystemExit("Missing or invalid HTTPS Pages URL")
          marker_url = urllib.parse.urljoin(base_url, "soeasysite-release.json")
          deadline = time.monotonic() + 300
          attempt = 0
          while time.monotonic() < deadline:
              attempt += 1
              url = marker_url + "?verify=" + str(time.time_ns())
              request = urllib.request.Request(url, headers={
                  "Cache-Control": "no-cache, no-store, max-age=0",
                  "Pragma": "no-cache",
                  "Accept": "application/json",
              })
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      actual = json.load(response)
                  if actual == expected:
                      print("Public release verified: " + json.dumps(expected), flush=True)
                      break
                  print(f"Attempt {attempt}: previous release still visible", flush=True)
              except (urllib.error.URLError, TimeoutError, ValueError) as error:
                  print(f"Attempt {attempt}: marker unavailable ({type(error).__name__})", flush=True)
              time.sleep(min(5, max(0, deadline - time.monotonic())))
          else:
              raise SystemExit("Pages reported success, but the expected public release was not visible within 5 minutes")
          PY
