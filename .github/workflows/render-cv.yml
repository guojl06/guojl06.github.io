name: Render a CV
on:
  push:
    branches:
      - main
      - master
    paths:
      - "_data/cv.yml"
      - "assets/rendercv/design.yaml"
      - "assets/rendercv/locale.yaml"
      - "assets/rendercv/settings.yaml"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RenderCV
        run: |
          pip install -r requirements.txt
      # Step 1: ALWAYS sync the web-page data first, so it updates even if PDF fails.
      - name: Sync resume.json from cv.yml
        run: |
          python bin/cv_to_resume_json.py
          echo "Generated resume.json:"
          python -c "import json;d=json.load(open('assets/json/resume.json'));print(' name:',d['basics']['name'])"
      # Step 2: Try to generate the PDF. Non-fatal: RenderCV may reject non-ASCII
      # names (e.g. Chinese). The web page already updated in step 1 regardless.
      - name: Render PDF (non-fatal)
        continue-on-error: true
        run: |
          cv_file=$(find _data  -maxdepth 1 -type f \( -name "cv.yaml" -o -name "cv.yml" \))
          if [ -z "$cv_file" ]; then
            echo "No cv.yml file found!"
            exit 1
          fi
          rendercv_dir=$(find assets -maxdepth 1 -type d -name "rendercv")
          if [ -z "$rendercv_dir" ]; then
            echo "No RenderCV config directory found!"
            exit 1
          fi
          settings=$(find $rendercv_dir -maxdepth 1 -type f \( -name "settings.yaml" -o -name "settings.yml" \))
          if [ -z "$settings" ]; then
            echo "Missing RenderCV config file!"
            exit 1
          fi
          rendercv render $cv_file --settings $settings
          rm -f assets/rendercv/rendercv_output/*.typ
      # Step 3: Copy the PDF to a stable path IF rendercv produced one.
      - name: Copy PDF for download button
        run: |
          mkdir -p assets/pdf
          if ls assets/rendercv/rendercv_output/*.pdf 1> /dev/null 2>&1; then
            cp assets/rendercv/rendercv_output/*.pdf assets/pdf/cv.pdf
            echo "PDF updated."
          else
            echo "No PDF was generated (RenderCV may have failed). Keeping previous cv.pdf."
          fi
      - name: Upload rendercv_output as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenderCV Output
          path: assets/rendercv/rendercv_output
      - name: Push the changes
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -m "chore: render the latest CV"
          git push
